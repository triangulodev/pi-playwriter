<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">pi-playwriter</title>
  <desc id="desc">Minimal monochrome technical manual header reading pi-playwriter, Browser Automation on Pi coding agent, playwriter by @remoses, pi extesion by @triangulodev.</desc>
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="42" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .mono { font-family: "Courier New", "IBM Plex Mono", "SFMono-Regular", monospace; fill: #060606; }
      .heavy { font-weight: 800; letter-spacing: 3px; }
      .label { font-size: 34px; font-weight: 700; letter-spacing: 2px; }
      .small { font-size: 26px; letter-spacing: 1px; }
      .line { stroke: #060606; stroke-width: 3; vector-effect: non-scaling-stroke; }
      .thin { stroke: #060606; stroke-width: 2; vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <rect x="7" y="7" width="1586" height="446" fill="#fbfbfa" stroke="#b8b8b8" stroke-width="3"/>
  <rect x="12" y="12" width="1586" height="446" fill="none" stroke="#d0d0d0" stroke-width="3"/>
  <rect x="7" y="7" width="1586" height="446" fill="#fbfbfa" filter="url(#paperNoise)" opacity="0.96"/>

  <text class="mono label" x="72" y="88">triangulo.dev</text>
  <text class="mono label" x="1260" y="88">pi extension</text>

  <text class="mono heavy" x="800" y="190" text-anchor="middle" font-size="72">pi-playwriter</text>
  <text class="mono label" x="800" y="252" text-anchor="middle">BROWSER AUTOMATION ON PI CODING AGENT</text>

  <line class="line" x1="72" y1="304" x2="1528" y2="304"/>
  <line class="thin" x1="72" y1="312" x2="1528" y2="312"/>

  <text class="mono small" x="72" y="368">[TOOL] playwriter</text>
  <text class="mono small" x="72" y="414">playwriter by @remoses</text>
  <text class="mono small" x="1066" y="414">pi extesion by @triangulodev</text>
</svg>
