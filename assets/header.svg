<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">pi-playwriter</title>
  <desc id="desc">Minimal monochrome technical card for @triangulodev/pi-playwriter and Playwriter.</desc>
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="42" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .mono { font-family: "Fira Code", "Courier New", monospace; fill: #060606; font-size: 30px; letter-spacing: 0.5px; }
      .bold { font-weight: 800; }
      .thin { stroke: #060606; stroke-width: 2; vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <rect x="7" y="7" width="1586" height="286" fill="#fbfbfa" stroke="#b8b8b8" stroke-width="3"/>
  <rect x="12" y="12" width="1576" height="276" fill="none" stroke="#d0d0d0" stroke-width="3"/>
  <rect x="7" y="7" width="1586" height="286" fill="#fbfbfa" filter="url(#paperNoise)" opacity="0.96"/>

  <text class="mono bold" x="72" y="78">[TOOL] @TRIANGULODEV/PI-PLAYWRITER</text>
  <text class="mono" x="72" y="122">[DESC] BROWSER AUTOMATION ON PI CODING AGENT</text>

  <line class="thin" x1="72" y1="154" x2="1528" y2="154"/>

  <text class="mono" x="72" y="210">[TOOL] PLAYWRITER</text>
  <text class="mono" x="72" y="254">[AUTH] @REMORSES</text>
</svg>
